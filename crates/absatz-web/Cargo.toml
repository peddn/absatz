[package]
name = "absatz-web"
description = "The Absatz web app (Leptos, client-side rendered). Built with Trunk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
absatz-core.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "CharacterData",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "Node",
    "NodeList",
    "Performance",
    "Range",
    "Selection",
    "Text",
    "UrlSearchParams",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
console_error_panic_hook.workspace = true

[lints]
workspace = true
