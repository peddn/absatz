[package]
name = "absatz-typeset"
description = "Typesetting with Typst: pages, preview images and PDF. Runs natively and in a Web Worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
absatz-core.workspace = true
typst.workspace = true
typst-assets.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-svg.workspace = true
typst-render.workspace = true
comemo.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Performance"] }
console_error_panic_hook.workspace = true

[lints]
workspace = true
